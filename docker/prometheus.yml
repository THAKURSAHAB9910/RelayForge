global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "relayforge-core"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["cpp-engine:8080"]

  - job_name: "relayforge-java-api"
    metrics_path: "/api/v1/metrics"
    static_configs:
      - targets: ["java-api:8000"]
