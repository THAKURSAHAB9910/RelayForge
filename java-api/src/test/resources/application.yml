server:
  port: 8000

spring:
  application:
    name: relayforge-java-api-test

relayforge:
  engine:
    base-url: http://localhost:8080
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    max-connections: 100
    max-connections-per-route: 30
    retry:
      max-attempts: 3
      backoff-ms: 500
