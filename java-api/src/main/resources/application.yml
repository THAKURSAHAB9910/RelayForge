server:
  port: ${PORT:8000}

spring:
  application:
    name: relayforge-java-api

relayforge:
  engine:
    base-url: ${RELAYFORGE_ENGINE_URL:http://localhost:8080}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    max-connections: 100
    max-connections-per-route: 30
    retry:
      max-attempts: 3
      backoff-ms: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
